<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Эко Трекер</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-color: #181d26;
            --primary: #2ed573;
            --text: #e2e8f0;
            --accent: #1e90ff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-color);
            padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 420px; width: 100%; text-align: center;
        }
        h1 { font-size: 20px; color: var(--primary); margin: 0 0 15px 0; text-transform: uppercase; }
        
        .slider-wrapper {
            display: flex; align-items: center; justify-content: space-between;
            background: #202733; padding: 15px; border-radius: 15px; margin-bottom: 20px;
        }
        .arrow-btn {
            background: var(--accent); color: white; border: none; 
            width: 40px; height: 40px; border-radius: 50%; font-size: 20px;
            cursor: pointer; font-weight: bold; transition: 0.1s;
        }
        .arrow-btn:active { transform: scale(0.9); }
        .trash-card { flex-grow: 1; text-align: center; }
        .trash-icon { font-size: 45px; margin-bottom: 5px; }
        .trash-name { font-size: 16px; font-weight: bold; }

        .click-btn {
            background: var(--primary); color: white; border: none; padding: 16px;
            font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer;
            width: 100%; box-shadow: 0 4px 12px rgba(46,213,115,0.3); transition: 0.1s;
        }
        .click-btn:active { transform: scale(0.98); }

        .nav-menu { display: flex; justify-content: space-around; margin-top: 25px; border-top: 1px solid #2d3748; padding-top: 15px; }
        .nav-item { 
            background: #202733; border: none; color: var(--text); padding: 10px 20px; 
            border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; width: 45%;
        }
        .nav-item.active { background: var(--accent); }

        .page { display: none; text-align: left; margin-top: 15px; }
        .page.active { display: block; }
        
        .stat-line {
            display: flex; justify-content: space-between; background: #202733;
            padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 14px;
        }
        .clear-btn {
            background: none; border: none; color: #4a5568; font-size: 11px;
            text-decoration: underline; margin-top: 20px; cursor: pointer; display: block; width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Эко-Ассистент</h1>
        
        <div id="page-main" class="page active" style="text-align:center;">
            <div class="slider-wrapper">
                <button class="arrow-btn" onclick="changeTrash(-1)">◀</button>
                <div class="trash-card">
                    <div class="trash-icon" id="t-icon">🥫</div>
                    <div class="trash-name" id="t-name">Жестяная Банка</div>
                </div>
                <button class="arrow-btn" onclick="changeTrash(1)">▶</button>
            </div>
            <button class="click-btn" onclick="recycleTrash()">Выкинул/Убрал +1</button>
            
            <div style="margin-top: 15px; font-size: 14px; color: #718096;">
                Сегодня собрано этой категории: <span id="today-type-count" style="color:var(--primary); font-weight:bold;">0</span> шт.
            </div>
        </div>

        <div id="page-stats" class="page">
            <h3 style="color:var(--accent); margin-top:0; text-align:center;">📊 Твоя статистика</h3>
            
            <h4 style="margin: 10px 0 5px 0; color:#ffa502;">За текущую неделю:</h4>
            <div id="stats-week"></div>
            
            <h4 style="margin: 15px 0 5px 0; color:#ffa502;">За текущий месяц:</h4>
            <div id="stats-month"></div>
            
            <h4 style="margin: 15px 0 5px 0; color:#ffa502;">За весь год:</h4>
            <div id="stats-year"></div>

            <button class="clear-btn" onclick="resetStats()">Сбросить всю статистику</button>
        </div>

        <div class="nav-menu">
            <button class="nav-item active" id="btn-main" onclick="switchPage('main')">📱 Главная</button>
            <button class="nav-item" id="btn-stats" onclick="switchPage('stats')">📈 Статистика</button>
        </div>
    </div>

    <script>
        const trashTypes = [
            { id: 'cans', name: 'Жестяная Банка', icon: '🥫' },
            { id: 'glass', name: 'Стеклянная Бутылка', icon: '🍾' },
            { id: 'plastic', name: 'Пластик / ПЭТ', icon: '🥤' },
            { id: 'paper', name: 'Бумага / Картон', icon: '📦' },
            { id: 'other', name: 'Прочий мусор', icon: '🗑️' }
        ];
        let currentTrashIdx = 0;

        function getTimeKeys() {
            const d = new Date();
            const year = d.getFullYear();
            const month = d.getMonth();
            
            const tempDate = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            tempDate.setUTCDate(tempDate.getUTCDate() + 4 - (tempDate.getUTCDay()||7));
            const yearStart = new Date(Date.UTC(tempDate.getUTCFullYear(),0,1));
            const week = Math.ceil((((tempDate - yearStart) / 86400000) + 1)/7);

            return {
                day: d.toLocaleDateString('ru-RU'),
                week: `w_${year}_${week}`,
                month: `m_${year}_${month}`,
                year: `y_${year}`
            };
        }

        let db = JSON.parse(localStorage.getItem('eco_db_clean')) || {
            lastDay: '', lastWeek: '', lastMonth: '',
            today: {}, week: {}, month: {}, year: {}
        };

        const keys = getTimeKeys();
        if (db.lastDay !== keys.day) { db.today = {}; db.lastDay = keys.day; }
        if (db.lastWeek !== keys.week) { db.week = {}; db.lastWeek = keys.week; }
        if (db.lastMonth !== keys.month) { db.month = {}; db.lastMonth = keys.month; }
        saveDB();

        function changeTrash(dir) {
            currentTrashIdx += dir;
            if (currentTrashIdx < 0) currentTrashIdx = trashTypes.length - 1;
            if (currentTrashIdx >= trashTypes.length) currentTrashIdx = 0;
            updateTrashSlider();
        }

        function updateTrashSlider() {
            const type = trashTypes[currentTrashIdx];
            document.getElementById('t-icon').innerText = type.icon;
            document.getElementById('t-name').innerText = type.name;
            document.getElementById('today-type-count').innerText = db.today[type.id] || 0;
        }

        function recycleTrash() {
            const type = trashTypes[currentTrashIdx].id;
            
            db.today[type] = (db.today[type] || 0) + 1;
            db.week[type] = (db.week[type] || 0) + 1;
            db.month[type] = (db.month[type] || 0) + 1;
            db.year[type] = (db.year[type] || 0) + 1;
            
            saveDB();
            updateTrashSlider();
        }

        function saveDB() {
            localStorage.setItem('eco_db_clean', JSON.stringify(db));
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`page-${pageId}`).classList.add('active');
            document.getElementById(`btn-${pageId}`).classList.add('active');

            if (pageId === 'stats') renderStats();
        }

        function renderStats() {
            function buildBlock(dataObj) {
                let html = '';
                let total = 0;
                trashTypes.forEach(t => {
                    const count = dataObj[t.id] || 0;
                    total += count;
                    html += `<div class="stat-line"><span>${t.icon} ${t.name}</span><span style="font-weight:bold;">${count} шт.</span></div>`;
                });
                html += `<div class="stat-line" style="background:#2d3748; font-weight:bold; color:var(--primary);"><span>Всего убрано:</span><span>${total} шт.</span></div>`;
                return html;
            }
            document.getElementById('stats-week').innerHTML = buildBlock(db.week);
            document.getElementById('stats-month').innerHTML = buildBlock(db.month);
            document.getElementById('stats-year').innerHTML = buildBlock(db.year);
        }

        function resetStats() {
            if (confirm('Точно стереть всю личную историю?')) {
                localStorage.removeItem('eco_db_clean');
                db = { lastDay: keys.day, lastWeek: keys.week, lastMonth: keys.month, today: {}, week: {}, month: {}, year: {} };
                saveDB();
                renderStats();
                updateTrashSlider();
            }
        }

        updateTrashSlider();
    </script>
</body>
</html>
